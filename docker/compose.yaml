name: supportflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SF_DATABASE__NAME:-supportflow}
      POSTGRES_USER: ${SF_DATABASE__USER:-supportflow}
      POSTGRES_PASSWORD: ${SF_DATABASE__PASSWORD:?Copy .env.example to .env and set a password}
    ports:
      - "127.0.0.1:${SF_DATABASE__PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  postgres_data:
